[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
; SAVER_SECONDS: Tischtest, Display aus nach 20 Sekunden (im Web Menü einstellbar). Für den Standard (180)
; die Zeile -DSAVER_SECONDS=20 löschen.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=4
    -DTFT_RST=-1
    -DTOUCH_CS=5
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSUPPORT_TRANSACTIONS=1
    -DSAVER_SECONDS=20
